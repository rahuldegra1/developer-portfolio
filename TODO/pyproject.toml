[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # Handled by ruff format
    "B008",  # Allow Depends() and Query() in FastAPI endpoint signatures
]

[tool.ruff.lint.per-file-ignores]
"alembic/env.py" = ["F401"]
"alembic/versions/*" = ["E402"]
