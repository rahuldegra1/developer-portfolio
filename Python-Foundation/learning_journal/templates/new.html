<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>New Journal Post</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container my-5" style="max-width: 800px;">
        <a href="/" class="btn btn-outline-secondary mb-4">&larr; Back to Journal</a>
        <div class="card shadow p-4">
            <h2>Create New Learning Entry</h2>
            <form method="POST">
                <div class="mb-3">
                    <label class="form-label">Post Title</label>
                    <input type="text" name="title" class="form-control" placeholder="e.g., Python Decorators Explained" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Content (Markdown supported)</label>
                    <textarea name="content" class="form-control" rows="10" placeholder="# Overview&#10;&#10;Write your notes, code snippets, or algorithm breakdowns here..." required></textarea>
                </div>
                <button type="submit" class="btn btn-success w-100">Publish Entry</button>
            </form>
        </div>
    </div>
</body>
</html>
