{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <h2>Welcome, {{ current_user.username }}!</h2>
        <hr>
        <div class="card shadow p-3 mb-4">
            <h4>Add a New Note</h4>
            <form method="POST">
                <div class="mb-3">
                    <textarea name="note" class="form-control" rows="3" placeholder="Write your note here..." required></textarea>
                </div>
                <button type="submit" class="btn btn-primary">Save Note</button>
            </form>
        </div>

        <h4>Your Notes</h4>
        {% if notes %}
            <ul class="list-group">
                {% for note in notes %}
                    <li class="list-group-item mb-2 shadow-sm">{{ note.content }}</li>
                {% endfor %}
            </ul>
        {% else %}
            <p class="text-muted">You don't have any notes yet.</p>
        {% endif %}
    </div>
</div>
{% endblock %}
