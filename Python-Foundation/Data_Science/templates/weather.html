<!DOCTYPE html>
<html>
<head>
    <title>Global Weather</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #2c3e50; color: white; text-align: center; padding-top: 50px; }
        .card { background-color: #34495e; padding: 40px; border-radius: 12px; display: inline-block; box-shadow: 0 8px 16px rgba(0,0,0,0.3); }
        input { padding: 12px; border: none; border-radius: 4px; margin-right: 10px; width: 200px; font-size: 16px; }
        button { padding: 12px 24px; background-color: #3498db; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 16px;}
        button:hover { background-color: #2980b9; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Global Weather</h1>
        <form method="POST">
            <input type="text" name="city" placeholder="Search a city..." required>
            <button type="submit">Search</button>
        </form>
        
        <br>
        
        {% if weather.error %}
            <p style="color: #e74c3c; font-weight: bold;">{{ weather.error }}</p>
        {% elif weather.temp %}
            <h2 style="color: #bdc3c7; margin-bottom: 0;">{{ weather.city }}</h2>
            <h1 style="font-size: 72px; margin: 10px 0;">{{ weather.temp }}°C</h1>
        {% endif %}
    </div>
</body>
</html>
