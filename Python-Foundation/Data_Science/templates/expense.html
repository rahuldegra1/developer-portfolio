<!DOCTYPE html>
<html>
<head>
    <title>Expense Tracker</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #f8f9fa; color: #212529; max-width: 800px; margin: 40px auto; padding: 20px; }
        .card { background-color: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h1 { color: #2c3e50; margin-top: 0; }
        .total { font-size: 28px; font-weight: bold; color: #e74c3c; margin-bottom: 20px; padding: 15px; background-color: #fadbd8; border-radius: 5px; display: inline-block;}
        input, select, button { padding: 10px; margin-right: 5px; margin-bottom: 10px; border: 1px solid #ced4da; border-radius: 4px; font-size: 16px;}
        button { background-color: #28a745; color: white; border: none; cursor: pointer; font-weight: bold; }
        button:hover { background-color: #218838; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #dee2e6; }
        th { background-color: #e9ecef; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Financial Tracker</h1>
        
        <!-- Dynamically displays the Pandas sum calculation -->
        <div class="total">Total Spent: ${{ "%.2f"|format(total) }}</div>
        
        <form action="/add" method="POST">
            <input type="text" name="description" placeholder="What did you buy?" required>
            <input type="number" step="0.01" name="amount" placeholder="Amount (e.g. 15.50)" required>
            <select name="category">
                <option value="Food">Food</option>
                <option value="Transport">Transport</option>
                <option value="Utilities">Utilities</option>
                <option value="Entertainment">Entertainment</option>
                <option value="Other">Other</option>
            </select>
            <button type="submit">Log Expense</button>
        </form>
        
        <table>
            <tr>
                <th>Description</th>
                <th>Category</th>
                <th>Cost</th>
            </tr>
            <!-- Loop through the SQL data -->
            {% for row in expenses %}
            <tr>
                <td>{{ row.description }}</td>
                <td>{{ row.category }}</td>
                <td>${{ "%.2f"|format(row.amount) }}</td>
            </tr>
            {% else %}
            <tr>
                <td colspan="3">No expenses recorded yet.</td>
            </tr>
            {% endfor %}
        </table>
    </div>
</body>
</html>
