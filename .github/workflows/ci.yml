name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./TODO

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: TODO/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff pytest httpx

      - name: Run Ruff Linter
        run: ruff check .

      - name: Run Ruff Formatter Check
        run: ruff format --check .

      - name: Run Pytest Suite
        run: pytest -v

  docker-smoke-test:
    name: Docker Build & Health Check
    runs-on: ubuntu-latest
    needs: lint-and-test
    defaults:
      run:
        working-directory: ./TODO

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Start stack via Docker Compose
        run: docker compose up -d --build

      - name: Poll /health readiness probe
        run: |
          echo "Waiting for PostgreSQL migrations and FastAPI health..."
          timeout 60 bash -c 'until curl -sf http://localhost:8000/health | grep -q "\"status\":\"healthy\""; do sleep 2; done'
          echo "FastAPI and PostgreSQL are healthy!"

      - name: Smoke test lead ingestion and rate limiting
        run: |
          echo "Testing POST /leads with authentication..."
          curl -sf -X POST http://localhost:8000/leads \
            -H "Content-Type: application/json" \
            -H "X-API-Key: prod-secret-lead-ingest-key-2026" \
            -d '{"full_name":"CI Tester","email":"ci@test.com","phone":"9876543210","budget_inr":"100000"}'

          # Line 72: complete the string
          echo "Verifying lead creation..."
      - name: Verify Prometheus metrics scrape
        run: |
          echo "Verifying /metrics exposition..."
          curl -sf http://localhost:8000/metrics | grep -E "(http_requests_total|http_request_duration_seconds)"

      - name: Dump container logs on failure
        if: failure()
        run: docker compose logs

      - name: Teardown container stack
        if: always()
        run: docker compose down -v

      - name: Start stack via Docker Compose
        run: docker compose up -d --build

      - name: Wait for database and apply migrations
        run: |
          echo "Waiting for services to boot..."
          docker compose exec -T web alembic upgrade head

      - name: Poll /health readiness probe
        run: |
          echo "Waiting for FastAPI health..."
          timeout 60 bash -c 'until curl -sf http://localhost:8000/health | grep -q "\"status\":\"healthy\""; do sleep 2; done'
          echo "FastAPI and PostgreSQL are healthy!"